name: Deploy cloud Worker

# Deploys cloud/ (woodrail-cloud) when a push to main changes it, after its tests. GitHub Pages deploys the same push,
# so the game and the Worker stay in step. A deploy leaves the Worker's secrets (CODE_KEY, GITHUB_TOKEN, ADMIN_KEY)
# alone. See cloud/README.md.
#
# Needs, once: a CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit on the account, nothing more) and a
# CLOUDFLARE_ACCOUNT_ID variable.

on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Check settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Set the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check it answers
        # No code sent: 400. CORS preflight for feedback: 204.
        env:
          URL: ${{ vars.WOODRAIL_CLOUD_URL }}
        run: |
          [ -n "$URL" ] || { echo "WOODRAIL_CLOUD_URL unset: skipping the check"; exit 0; }
          saves=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/saves/sandbox")
          pre=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://dwfennell.github.io' \
            -H 'Access-Control-Request-Method: POST' "$URL/feedback")
          echo "saves $saves (want 400), feedback preflight $pre (want 204)"
          [ "$saves" = 400 ] && [ "$pre" = 204 ]
