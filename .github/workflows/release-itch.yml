name: Release to itch.io

# itch gets releases only, not every push to main (that's GitHub Pages). Either push main to the itch branch
# (`git push origin main:itch`): the next patch version is tagged and released for you once it's on itch. Or publish a
# GitHub Release by hand (tag v1.2.0, say) for a bigger step. See docs/itch-builds.md.
#
# Needs, once: a BUTLER_API_KEY secret (an itch.io API key) and an ITCH_GAME variable ("user/game", the project's
# itch.io URL parts).

on:
  push:
    branches: [itch]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to push to itch"
        required: true

permissions:
  # write: a push to the itch branch tags and releases its version. (A release made with this token doesn't start
  # this workflow again.)
  contents: write

concurrency:
  group: itch
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
    steps:
      - name: Check settings
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Set the BUTLER_API_KEY secret (an itch.io API key)"; exit 1; }
          [ -n "$ITCH_GAME" ] || { echo "::error::Set the ITCH_GAME variable, e.g. dwfennell/woodrail"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - name: Version
        # A release or a hand run keeps its ref. A push to itch gets the commit's own vX.Y.Z tag if it has one (itch
        # moved back to a release), else the latest vX.Y.Z with the patch bumped.
        if: github.event_name == 'push'
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
            echo "NEW_TAG=$tag" >> "$GITHUB_ENV"
          fi
          echo "REF=$tag" >> "$GITHUB_ENV"
          echo "Version: $tag"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:itch
        env:
          # Play stats go to the cloud Worker (docs/stats.md); unset till it's deployed: no stats.
          VITE_STATS_URL: ${{ vars.WOODRAIL_CLOUD_URL }}
      - name: Install butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
      - name: Push to itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: ./butler/butler push dist-itch "$ITCH_GAME:html5" --userversion "$REF"
      - name: Release
        # Only once it's on itch, so a failed run leaves no tag.
        if: env.NEW_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$NEW_TAG" --target "$GITHUB_SHA" --generate-notes --title "Woodrail $NEW_TAG"
