name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Project pages are served from /<repo>/, not the domain root.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # The cloud saves' Worker (cloud/README.md), set as a repository variable once it's deployed. Unset: no
          # Cloud save in the game. (The Worker itself is deployed by hand, never from here.)
          VITE_CLOUD_URL: ${{ vars.WOODRAIL_CLOUD_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
