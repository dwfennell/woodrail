# Woodrail's cloud saves (see README.md). Deployed by hand, never from CI.
name = "woodrail-cloud"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "woodrail-saves"

[vars]
# The pages that may call the Worker (comma separated): the deployed game, and the dev server.
ALLOWED_ORIGINS = "https://dwfennell.github.io,http://localhost:5173,http://127.0.0.1:5173"
