<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cbbba3" />
    <title>Woodrail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Needed at first paint (the rest of the styles come with the scripts): the loading screen and block letters. */
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #f3e6cf, #cbb595); transition: opacity 0.6s ease; z-index: 50; font-family: "Nunito", system-ui, sans-serif; color: #2b2118; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: clamp(34px, 9.5vw, 76px); }
      #loading p { margin: 18px 0 0; opacity: 0.7; text-align: center; font-weight: 700; }
      #loading .loading-toys { display: block; width: min(560px, 92vw); height: clamp(100px, 20vw, 140px); margin: 6px auto -10px; }
      #loading .load-retry { display: block; margin: 14px auto 0; padding: 10px 22px; border: 0; border-radius: 999px; background: #c8442f; color: #fff; font: 800 16px "Nunito", system-ui, sans-serif; cursor: pointer; }
      #loading .wb { animation: wb-hop 1.4s ease-in-out calc(var(--i) * 0.11s) infinite; }
      @keyframes wb-hop { 0%, 60%, 100% { translate: 0 0; } 25% { translate: 0 -0.22em; } 40% { translate: 0 0.02em; } }
      @media (prefers-reduced-motion: reduce) { #loading .wb { animation: none; } }

      /* Wooden alphabet blocks: a beech cube per letter (1em), the letter painted inside a framed face. */
      .wood-blocks { display: inline-flex; gap: 0.08em; line-height: 1; vertical-align: middle; }
      .wb-gap { width: 0.3em; }
      .wb {
        position: relative; display: inline-grid; place-items: center; width: 1em; height: 1em; border-radius: 0.11em;
        transform: translateY(var(--lift, 0)) rotate(var(--tilt, 0deg));
        background:
          radial-gradient(ellipse 0.7em 0.18em at 30% 72%, rgba(150, 100, 50, 0.16), transparent 70%),
          repeating-linear-gradient(94deg, rgba(160, 110, 60, 0) 0 0.05em, rgba(160, 110, 60, 0.13) 0.06em 0.07em, rgba(160, 110, 60, 0) 0.08em 0.15em, rgba(160, 110, 60, 0.08) 0.16em 0.17em),
          linear-gradient(160deg, #f4dcb0, #e2bd85 60%, #d6ab6e);
        box-shadow: inset 0 0.03em 0 rgba(255, 250, 235, 0.7), inset 0 -0.05em 0 rgba(120, 75, 30, 0.28), 0 0.07em 0 #b07a44, 0 0.08em 0.03em rgba(70, 40, 15, 0.35), 0 0.16em 0.28em rgba(40, 25, 10, 0.3);
      }
      .wb::before { content: ""; position: absolute; inset: 0.09em; border: 0.045em solid var(--ink, #c8442f); border-radius: 0.06em; opacity: 0.85; }
      .wb b { font: 800 0.6em/1 "Nunito", system-ui, sans-serif; color: var(--ink, #c8442f); text-shadow: 0 0.03em 0 rgba(255, 245, 225, 0.45), 0 -0.02em 0 rgba(60, 30, 10, 0.25); translate: 0 -0.02em; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loading">
      <div>
        <h1>
          <span class="wood-blocks" role="img" aria-label="Woodrail"
            ><span class="wb" style="--ink: #c8442f; --tilt: -3deg; --lift: 0em; --i: 0"><b>W</b></span
            ><span class="wb" style="--ink: #2f6fb5; --tilt: 2deg; --lift: -0.04em; --i: 1"><b>O</b></span
            ><span class="wb" style="--ink: #e2a12b; --tilt: -1.5deg; --lift: 0.02em; --i: 2"><b>O</b></span
            ><span class="wb" style="--ink: #3f8f4a; --tilt: 3.5deg; --lift: -0.02em; --i: 3"><b>D</b></span
            ><span class="wb" style="--ink: #c8442f; --tilt: -2.5deg; --lift: 0.03em; --i: 4"><b>R</b></span
            ><span class="wb" style="--ink: #2f6fb5; --tilt: 1deg; --lift: -0.05em; --i: 5"><b>A</b></span
            ><span class="wb" style="--ink: #e2a12b; --tilt: -3.5deg; --lift: 0.01em; --i: 6"><b>I</b></span
            ><span class="wb" style="--ink: #3f8f4a; --tilt: 2.5deg; --lift: -0.03em; --i: 7"><b>L</b></span></span
          >
        </h1>
        <canvas class="loading-toys" aria-hidden="true"></canvas>
        <p>Sanding the track…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
